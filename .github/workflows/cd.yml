name: CD

on:
  push:
    branches:
      - main

jobs:
  publish-api:
    name: Publish API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore
        run: dotnet restore DevAssist.sln --configfile nuget.config

      - name: Publish
        run: |
          dotnet publish src/DevAssist.Api/DevAssist.Api.csproj \
            --configuration Release \
            --output ./publish/api \
            --no-restore

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: devassist-api
          path: ./publish/api
          retention-days: 7

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/devassist-ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/devassist-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: devassist-ui
          path: frontend/devassist-ui/dist
          retention-days: 7
