name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-api:
    name: Build & Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore
        run: dotnet restore DevAssist.sln --configfile nuget.config

      - name: Build
        run: dotnet build DevAssist.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DevAssist.sln --no-build --configuration Release --verbosity normal

  build-ui:
    name: Build & Lint UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/devassist-ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/devassist-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
